datapath=./dataset/Symmap/one.txt
ratings.setup=-columns 0 1 2
model.name=HDCTI
model.variant=symmap_c4p4_joint_sdis_v1
evaluation.setup=-four-state-unit
evaluation.outer.test=False
experiment.protocol=strict
support.four.state.manifest=./dataset/Symmap/splits/support_complete_seed_2026_k5/four_state_seed_2026_c4_p4/manifest.json
random.seed=2026
early.stopping=True
validation.ratio=0.1
validation.seed=102026
validation.metric=AUPR
validation.interval=2
validation.patience=5
validation.min.delta=0.0001
negative.strategy=random
pair.decoder=dot
pair.mlp.hidden=64
pair.prediction.batch.size=65536
context.interaction=True
context.compound_disease=False
context.herb_protein=True
context.herb_protein.mode=static
context.herb_disease=False
counterfactual.context=False
context.mask.training=False
support.router=False
support.experts=False
support.state.routing=False
hyperedge.attention=False
global.token.attention=False
hplga.enabled=False
inductive.context=True
inductive.context.suppress.base.zero.support=True
inductive.context.self.excluded=False
weight.reg=0.01
num.factors=64
num.max.epoch=50
batch_size=2000
attention.max.nodes=0
gpu.id=0
gpu.allow_growth=True
gpu.multiprocessing=False
gpu.log_device_placement=False
learnRate=-init 0.005 -max 1
reg.lambda=-u 0.001 -i 0.001 -b 0.2 -s 0.2
output.setup=on -dir ./results/
